# Reference/control model, not a serving target. Qwen3-Next shares the delta-net
# code path with Kimi K3's KDA layers and is supported UPSTREAM, which makes it
# the check that says whether a delta-net change is a K3 problem or an ik one.
#
# It earned its place. An upstream bug report was drafted claiming
# --spec-ckpt-mode auto corrupts recurrent models on CPU-only builds, reasoned
# from K3's 69 KDA layers. Running this model through the same probe returned
# 5/5 tool calls with speculation on the default mode - a recurrent model that
# was FINE - which is what made the theory untenable and led to the real fault:
# our own builder never passed build_qkv's per-step checkpoint tensors.
#
# Run it with serving/validate-model.sh on a spare port after touching
# ggml_delta_net, iqk_fused_delta_net, or build_kimi_k3.cpp's KDA path. 46 GB,
# loads in seconds, and it is the difference between reporting a bug and
# reporting your own.
