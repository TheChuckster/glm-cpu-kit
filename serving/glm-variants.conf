# Model variant registry.
#
# One line per servable model. `glm-model` reads this to download, switch and
# report; serve-glm.sh reads it to resolve the active variant to a file path
# AND to the serving flags that particular model needs.
#
# Fields, pipe-separated:
#   name      short handle used with `glm-model use <name>`
#   repo      HuggingFace repo id
#   subdir    directory within the repo (empty for repo root)
#   prefix    filename prefix, without the -000NN-of-000MM.gguf suffix
#   shards    number of shards, 1 for a single unsharded <prefix>.gguf, or ?
#             to resolve from HuggingFace on first use
#   alias     --alias passed to llama-server; what /v1/models reports
#   dir       local directory holding the weights
#   engine    build tree under ~/ik_llama.cpp that serves this variant, or an
#             absolute path to a llama-server binary. EMPTY = build (default)
#   opts      extra llama-server flags for THIS model (must be the last field)
#
# `opts` is appended LAST on the server command line, so it overrides anything
# serve-glm.sh already set (--ctx-size, sampling, ...). It is expanded as shell
# words, which is how a JSON argument keeps its embedded space. This file is
# root-owned and read by a root-installed unit; treat its contents with the
# same trust as the unit file itself.
#
# Why `engine` exists: architectures land in ik_llama.cpp continuously, and the
# commit that can serve a newly released model is always much newer than the one
# that has been serving the existing ones well. DeepSeek-V4 forced the issue -
# `deepseek4` landed over 2026-07-22..08-03, long after the commit this box had
# been running GLM on since July. Pointing the single global engine at a
# two-week-newer commit to gain one model silently re-rolls the dice on every
# other model on the box. A per-variant engine means a new architecture is
# brought up in its own build tree and nothing else moves until it is proven.
#
# EVERY ROW IS EMPTY AS OF 2026-08-07, and that is the mechanism working, not
# going unused. It bought up deepseek4 and then kimi-k3 without disturbing
# anything already serving; once each was proven the trees converged, and all
# three models now validate on one commit. Three build trees compiled from the
# same source is not isolation, it is 870 MB and three rebuilds.
#
# It also has a failure mode worth naming, because it bit: a pinned tree does not
# move when you rebase, so `build-ds4` sat three weeks behind while `build-k3`
# went forward, missing #2242 (DSV4 tool calls) and #2256 (the antirez GGUFs this
# file recorded as segfaulting). Nothing announces that. If you pin an engine
# again for the next architecture, put a note here saying when to unpin it - and
# `ls -l ~/ik_llama.cpp/build*/bin/llama-server` shows the drift at a glance.
#
# Not every publisher shards. `shards 1` means a single <prefix>.gguf with no
# suffix at all, which is how ggml-org and antirez ship DeepSeek-V4-Flash (one
# ~155 GB file).
#
# Why opts exists: "turn thinking off" is not one flag across model families,
# and runbook §10 explains why it MUST be off for agentic harnesses. GLM's
# template takes an enable_thinking kwarg. Kimi's template has no such variable
# at all - it unconditionally opens the assistant turn with <think> - so that
# kwarg is silently a no-op there and Kimi needs --reasoning off instead.
# Before this field existed those flags were hardcoded in serve-glm.sh, which
# meant every model got GLM's.
#
# Only ONE variant is resident at a time: these are 340-590 GB each and --mlock
# pins them, so two would not fit in 1.1 TB. Switching is a full reload of
# several minutes off NVMe, not a hot swap.

# ---------------------------------------------------------------------------
# GLM-5.2
#
# A note on the abliterated options. huihui-ai is the established publisher of
# abliterated models, but their GLM-5.2 repo tops out at Q3 - there is no
# Q4-class quant in it at all. frz1's Q4_K_M matches the base model's quant
# class and size almost exactly, but the publisher is unknown and the quality
# cost of their ablation is unverified. Both are registered; they are not
# equivalent, and which one is "closest" depends on whether you care more about
# quantisation or about provenance.
#
# ---------------------------------------------------------------------------
# Kimi
#
# Kimi K2.x is a ~1T MoE with ~32B active, against GLM-5.2's 753B/~40B. Fewer
# ACTIVE parameters means faster token generation on this box - TG is bandwidth-
# bound (runbook §0) - so these should generate quicker than GLM at a comparable
# quant, while costing ~145 GB more RAM to hold.
#
# Both Kimi rows below are genuine 4-bit and fit with room to spare:
#   kimi-k2.7-code  unsloth dynamic UD-Q4_K_XL, 584 GB. Current Kimi coder.
#   kimi-k2.6       ubergarm Q4_X, 584 GB / 4.549 bpw, built to match Moonshot's
#                   official int4 release. ubergarm quants target ik_llama.cpp
#                   specifically, which is the engine we run.
#
# CAVEAT before pointing an agent at either: ik #1605 (open, no comments since
# 2026-04-09) reports a silent HTTP 400 on multi-turn tool calls for this
# template family - only after the first tool-call round-trip, and a fresh
# request then succeeds, so it reads like flaky networking. --reasoning off does
# NOT avoid it. Chat and single-shot coding are fine; treat agentic loops as
# unproven and keep GLM as the known-good agentic path. Runbook 6a has detail.
#
# Kimi K3 IS now loadable, on a forked engine - see the block above its rows.

# name           |repo                                      |subdir     |prefix                       |shards|alias                  |dir                                    |engine|opts
base             |unsloth/GLM-5.2-GGUF                      |UD-Q4_K_XL |GLM-5.2-UD-Q4_K_XL           |11    |glm-5.2                |/models/GLM-5.2-Q4_K_XL/UD-Q4_K_XL     |      |--chat-template-kwargs '{"enable_thinking": false}'
abliterated      |frz1/GLM-5.2-abliterated-GGUF             |Q4_K_M     |GLM-5.2-abliterated-Q4_K_M   |10    |glm-5.2-abliterated    |/models/GLM-5.2-abliterated-Q4_K_M     |      |--chat-template-kwargs '{"enable_thinking": false}'
abliterated-q3   |huihui-ai/Huihui-GLM-5.2-abliterated-GGUF |UD-Q3_K_M  |GLM-5.2-UD-Q3_K_M            |9     |glm-5.2-abliterated-q3 |/models/GLM-5.2-abliterated-UD-Q3_K_M  |      |--chat-template-kwargs '{"enable_thinking": false}'
kimi-k2.7-code   |unsloth/Kimi-K2.7-Code-GGUF               |UD-Q4_K_XL |Kimi-K2.7-Code-UD-Q4_K_XL    |14    |kimi-k2.7-code         |/models/Kimi-K2.7-Code-UD-Q4_K_XL      |      |--reasoning off --temp 1.0 --top-p 0.95
kimi-k2.6        |ubergarm/Kimi-K2.6-GGUF                   |Q4_X       |Kimi-K2.6-Q4_X               |14    |kimi-k2.6              |/models/Kimi-K2.6-Q4_X                 |      |--reasoning off --temp 1.0 --top-p 0.95

# ---------------------------------------------------------------------------
# Kimi K3 - WORKING, on a forked engine.
#
# 1. A quant that FITS - SATISFIED as of 2026-07-29. unsloth published four
#    sub-4-bit tiers and all of them fit:
#
#        UD-IQ1_S    14 shards   594.0 GB
#        UD-IQ1_M    15 shards   648.9 GB
#        UD-IQ2_XXS  16 shards   711.1 GB
#        UD-Q2_K_XL  19 shards   861.3 GB   <- what the row below points at
#        UD-Q4_K_XL  32 shards  1508.7 GB   too big (RAM is 1133 GB)
#        UD-Q8_K_XL  34 shards  1561.2 GB   too big
#
#    Q8 being the same size as Moonshot's native MXFP4 release says it all: the
#    source is already 4-bit QAT, so tiers above it recover nothing and only
#    cost space, and tiers below it are destroying what the QAT put there.
#    UD-Q2_K_XL at ~2.5 bpw is the largest that fits, and whether it beats the
#    GLM-5.2 Q4 already running here is an open question - measure, don't assume.
#
#    ubergarm still has no K3 repo, so kimi-k3-ik remains a guess.
#
#    GrEarl's Q2_K (929 GB) also fits but its own README states the author
#    lacks the hardware to run or validate it; deliberately NOT registered.
#
#    `glm-model use kimi-k3-q5attn` works end to end and is the current
#    chuckdancer selection.
#
# 2. Engine support - PORTED, rebased, deployed, and validated.
#
#    ik_llama.cpp has no kimi-k3 architecture upstream and ikawrakow declined to
#    add one (ik #2203: "seriously beyond my hardware limits"). So the port lives
#    on TheChuckster/ik_llama.cpp branch kimi-k3. That branch is now the default
#    `build` tree for every model here, so the row below pins no engine.
#    Rebased 2026-08-22: upstream base 8337e4cd, fork tip f921647b. Firedancer's
#    kimi-k3/main-patches were compared; the only missing substantive patch was
#    its malformed-request HTTP 400 fix, now cfac74d2 in this fork.
#
#    Status: WORKING, chat and agentic. The live 2026-08-22 benchmark measured
#    42.607 tok/s prompt processing (897 tokens) and 4.453 tok/s generation
#    (mean of three forced 128-token samples); wikitext perplexity is 1.3253
#    (n_ctx 512) against a reference 1.55 measured at longer context on a worse
#    quant, and short questions answer correctly and reliably - capitals,
#    arithmetic, a correct recursive fibonacci, 2247 characters of accurate
#    technical prose on how a derailleur works. Tool calls land 5/5 and
#    kimi-opencode drives a real agent loop - but see the --spec-type note below,
#    which is what made that true.
#
#    NOTE the --cache-type-v f16 override on the row. serve-glm.sh sets q8_0 for
#    both caches, and ik asserts n_embd_head_v(0) %% block_size == 0 at init. K3
#    reports attention.value_length = 74, which is not divisible by q8_0's 32, so
#    the server aborts before loading. That field is meaningless for K3 - MLA
#    caches the compressed KV and derives V from it - but the assert does not know
#    that. f16 has block size 1 and sidesteps it at no real cost.
#
#    Chat output is clean: the fork carries a Kimi-K3 chat parser, so content
#    holds just the answer and reasoning_content holds the thinking. No marker
#    stripping needed downstream.
#
#    Speculation needed a FORK FIX to be safe here, not a flag. build_qkv takes
#    per_step_ssm/per_step_conv as trailing optional arguments and the K3 KDA
#    path never passed them, so the recurrent state was not snapshotted per draft
#    step and a rejected draft had nothing to roll back to. That produced 0/5
#    tool calls and 8000-token repetition loops. With the tensors wired
#    (rebased fork e3b9f045) it is 5/5 on the DEFAULT checkpoint mode, and speculation is
#    worth up to +123% on code-shaped output (7.5-9.6 tok/s against 4.30) - more
#    than the --spec-ckpt-mode cpu workaround gave, because that had to re-decode
#    on every rejection. --spec-ckpt-mode per-step measured indistinguishable
#    from the default, so the default stays and the flag is omitted.
#
#    Four earlier versions of this comment were wrong, each confidently: speed is
#    the caveat (no), the 2.479 bpw quant degenerates (no), speculation breaks K3
#    (no), the default checkpoint mode breaks K3 (no - our builder did). The
#    tell each time was blaming something unfixable.
#
#    Sampling is the official model-card recipe: temp 1.0, top_p 0.95, no
#    repetition penalty (--repeat-penalty 1.0 overrides serve-glm.sh's 1.1,
#    which mangles K3's structured tool output).
#
#    The quant ceiling is real but separate: UD-Q4_K_XL is 1508.7 GB against
#    1133 GB of RAM and nothing is published in between, so UD-Q2_K_XL is the
#    largest K3 this box can hold. That bounds quality, not tool calling.
#
#    Speed is no longer the story: the fused AVX-512 delta-net kernel in the fork
#    now handles K3's per-channel KDA gate, worth +29% prompt processing, and the
#    non-expert requantisation below took generation 3.65 -> 4.30 tok/s.
#
#    LLAMA_MAX_EXPERTS was raised 512 -> 1024 in the fork; in ik that is free
#    (the constant is used only at its definition and one assert).
#
# 3. Two things from Moonshot's README that change how K3 must be served:
#
#    - K3 ALWAYS thinks. There is no enable_thinking equivalent; effort is a
#      top-level reasoning_effort field (low/high/max, default max) that
#      llama.cpp has no flag for. So `--reasoning off` - correct for K2.x - is
#      meaningless here, and the rows below use --reasoning-format deepseek to
#      route thoughts into reasoning_content, which is what K3 returns.
#    - K3 was trained in "preserved thinking history" mode: multi-turn and tool
#      calls require the COMPLETE assistant message replayed back, including
#      reasoning_content AND tool_calls. The replay gate passes on the current
#      fork; clients must still preserve that message shape.
#
#    Sampling: the production row uses temp 1.0/top-p 0.95, repeat penalty 1.0,
#    low template effort, and a 1024-token default reasoning budget. Those are
#    deliberate agent-latency settings and are carried only by the Q5 row.
#
# On quant quality: K3's routed experts ship ALREADY 4-bit (mxfp4) from
# Moonshot, and the full native release is 1,561 GB against this box's 1,133 GB.
# A true 4-bit K3 therefore does not fit here at all, and anything that does fit
# is a requantisation of already-4-bit weights down to ~2-3 bpw. Treat quant
# quality as measured rather than inferred. Strongly prefer a dynamic
# quant (unsloth UD-*, ubergarm IQ*_K) over a flat one: holding the sensitive
# tensors at higher precision matters far more than usual when the source is
# already quantised.
#
# kimi-k3 now has a real shard count because the quant exists and the prefix the
# row guessed turned out to match. kimi-k3-ik keeps `?` - ubergarm has published
# nothing, so its subdir/prefix are still a guess and `glm-model list` should
# keep calling it `pending` rather than `absent`. `glm-model upstream` is what
# tells you when that changes, and prints the real names if they differ.
#
# name           |repo                                      |subdir     |prefix                       |shards|alias                  |dir                                    |engine|opts
# See the block near the end of this file for the -q5attn rows: requantizing
# ONLY the non-expert tensors is worth ~10% TG on every model here, because a
# few active experts means the always-read remainder dominates per-token reads.
kimi-k3-q5attn   |unsloth/Kimi-K3-GGUF                      |UD-Q2_K_XL |Kimi-K3-Q5attn               |19    |kimi-k3                |/models/Kimi-K3-Q5attn                 |        |--reasoning-format deepseek --cache-type-v f16 --repeat-penalty 1.0 --temp 1.0 --top-p 0.95 --chat-template-kwargs '{"thinking_effort": "low"}' --reasoning-budget 1024 --spec-type ngram-mod:n_max=16,n_min=2
kimi-k3          |unsloth/Kimi-K3-GGUF                      |UD-Q2_K_XL |Kimi-K3-UD-Q2_K_XL           |19    |kimi-k3                |/models/Kimi-K3-UD-Q2_K_XL             |        |--reasoning-format deepseek --cache-type-v f16
kimi-k3-abl      |Blackfrost-AI/KIMI-K3-Q2_K-GGUF-ABLITERATED|           |KIMI-K3-MXP4-DERISKED-Q2_K   |38    |kimi-k3-abl            |/models/Kimi-K3-abliterated-Q2_K       |        |--reasoning-format deepseek --cache-type-v f16
kimi-k3-ik       |ubergarm/Kimi-K3-GGUF                     |IQ2_KL     |Kimi-K3-IQ2_KL               |?     |kimi-k3-ik             |/models/Kimi-K3-IQ2_KL                 |      |--reasoning-format deepseek

# ---------------------------------------------------------------------------
# DeepSeek-V4-Flash-0731
#
# The first model registered here that is genuinely SMALL: 284B total but only
# ~13B active (43 layers, 256 routed experts, 6 active + 1 shared), and DeepSeek
# ships the experts natively at fp4, so a no-loss conversion is ~155 GB. That is
# a third of GLM-5.2 Q4 and it changes the economics of this box - token
# generation is bandwidth-bound (runbook §0), so ~7-8 GB read per token against
# GLM's ~23 GB should generate roughly 2-3x faster, and prompt processing is
# cheaper again because only 6 of 256 experts fire and DSA (index_topk 512,
# sliding_window 128) keeps long-context attention sparse.
#
# ENGINE: served by the default `build` since 2026-08-07. These rows used to pin
# `build-ds4` because ik's deepseek4 architecture did not exist before 2026-07-22
# and was still being fixed daily through 08-03 - two of those late fixes are CPU
# GEMM correctness (#2224 IQ3_XXS, #2233 IQ4_NL_R4 with FANCY_SIMD), so on a
# CPU-only box an older engine was not merely slow, it was wrong. Every model on
# the box now validates on one commit, so the separate tree was retired. See the
# `engine` note in the header for why the FIELD is still here.
#
# QUANT: because the source is already fp4, quantising ABOVE it recovers nothing
# (unsloth's Q8_K_XL is 161.9 GB against Q4_K_XL's 155.1 - the extra 7 GB buys
# precision the weights never had) and quantising below destroys what the fp4
# training put there. So the interesting axis is not "how many bits" but "what
# happens to the ~5% of tensors that are NOT fp4 experts" - attention, the
# hyper-connection layers, the compressor and the DSA indexer. Hence three rows,
# not a size ladder:
#
#   ds4-flash         ggml-org's straight MXFP4 conversion. The reference: no
#                     requantisation anywhere. Serve this unless measurement
#                     says otherwise.
#   ds4-flash-mix     WORKS as of 2026-08-07. This entry said "DOES NOT LOAD -
#                     SIGSEGV" for most of its life; that was true at pin 6038941
#                     and is no longer. ik #2256 "Fix Antirez DS4 GGUFs" fixed it,
#                     and on the current engine it passes all seven gate checks
#                     with tool calls 5/5. The segfault was in ik, not in the
#                     weights - antirez's README said they "should" work
#                     elsewhere, and it was right.
#
#                     The recipe is the interesting one: experts stay MXFP4 and
#                     the sensitive tensors lift to F16/Q8 (router F16, attention
#                     projections + shared experts + output Q8_0, indexer /
#                     compressor / hyper-connection F16, norms F32) - the same
#                     always-read-vs-routed split the local Q5attn requants
#                     exploit, arrived at independently and from the other
#                     direction.
#
#                     STILL NOT THE DEFAULT, for a reason that has nothing to do
#                     with loading: it carries rope scaling metadata upstream does
#                     not specify - yarn, factor 16 over a 64K base, where
#                     DeepSeek's own config declares 1M positions and no
#                     rope_scaling at all. That is a different positional setup
#                     from the reference, so it is a real alternative to measure
#                     against ds4-flash, not a drop-in for it.
#   ds4-flash-unsloth registered as the control for ik #2214/#2218, where
#                     unsloth's DS4 quants emitted garbage and failed to load
#                     CPU-only ("one of the quantization types in this model is
#                     broken" - ikawrakow). TESTED HERE AND IT IS FINE: coherent
#                     output, working tool calls, 22.09 tok/s. So that bug was
#                     specific to IQ3_XXS and fixed by #2224, not a blanket
#                     problem with unsloth's DS4 - a usable fallback, just
#                     fractionally slower than the reference for no benefit,
#                     since both are ~155 GB and neither requantises the experts.
#
# Sampling: DeepSeek's generation_config asserts only temperature 1.0 / top_p
# 1.0. DS4 always reasons - there is no enable_thinking kwarg, so GLM's flag is
# meaningless here and, like Kimi K3, it needs --reasoning-format deepseek to
# route thoughts into reasoning_content instead of into the visible answer.
#
# Tool calling: ik #2242 fixes DSV4 tool-call wiring, without which ik falls back
# to the autoparser - which forces string="true" on every argument, diverging
# from what the template renders and so breaking prompt caching, and losing
# parallel tool calls. That fix is IN the current engine (6b55d2c7) and all three
# DS4 rows measure 5/5 on tool calls. It was absent from 6038941, which is what
# this note used to warn about.

# name           |repo                                      |subdir     |prefix                                                                                       |shards|alias                     |dir                                          |engine   |opts
ds4-flash        |ggml-org/DeepSeek-V4-Flash-0731-GGUF      |           |DeepSeek-V4-Flash-0731-MXFP4                                                                 |1     |deepseek-v4-flash-0731    |/models/DeepSeek-V4-Flash-0731-MXFP4         |         |--reasoning-format deepseek --temp 1.0 --top-p 1.0 --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 4 --dry-penalty-last-n -1
ds4-flash-mix    |antirez/deepseek-v4-gguf                  |           |DeepSeek-V4-Flash-MXFP4Experts-F16HC-F16Compressor-F16Indexer-Q8Attn-Q8Shared-Q8Out-chat-v2-mxfp4-0731|1|deepseek-v4-flash-0731-mix|/models/DeepSeek-V4-Flash-0731-antirez-MXFP4 |         |--reasoning-format deepseek --temp 1.0 --top-p 1.0 --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 4 --dry-penalty-last-n -1
ds4-flash-abl  |huihui-ai/Huihui-DeepSeek-V4-Flash-0731-abliterated-GGUF|           |DeepSeek-V4-Flash-Q4-mxfp4-0731                                                              |1     |deepseek-v4-flash-0731-abl|/models/DS4-0731-abliterated-MXFP4           |         |--reasoning-format deepseek --temp 1.0 --top-p 1.0 --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 4 --dry-penalty-last-n -1
ds4-flash-unsloth|unsloth/DeepSeek-V4-Flash-0731-GGUF       |UD-Q4_K_XL |DeepSeek-V4-Flash-0731-UD-Q4_K_XL                                                            |5     |deepseek-v4-flash-0731-ud |/models/DeepSeek-V4-Flash-0731-UD-Q4_K_XL    |         |--reasoning-format deepseek --temp 1.0 --top-p 1.0 --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 4 --dry-penalty-last-n -1

# ABLITERATED siblings, added 2026-08-08. Both are registry rows only - nothing is
# downloaded until `glm-model download <variant>`, which matters because one of
# them is a terabyte.
#
#   ds4-flash-abl   huihui-ai's abliteration of the SAME 0731 MXFP4 the reference
#                   row serves: 156 GB, one unsharded file, no requantisation of
#                   the fp4 experts. Same publisher as `abliterated-q3` above.
#                   Ungated. This is the easy one - it fits with 977 GB to spare
#                   and needs no serving changes.
#
#   kimi-k3-abl     Blackfrost's 1009 GB / 38-shard Q2 build. It is ungated but
#                   has no published perplexity or capability result. It is not
#                   equivalent to the live Q5-attention build merely because it
#                   fits.
#
#                   MIND THE RAM. At 1009 GB of 1133 GB it is 89% - just UNDER
#                   serve-glm.sh's old 92% mlock test - and would have been pinned
#                   with 124 GB left for the OS, KV cache and compute buffers,
#                   where the 861 GB kimi-k3 that works leaves 272 GB. serve-glm.sh
#                   now also enforces an absolute headroom floor
#                   (MLOCK_MIN_HEADROOM_GB, default 160) and will drop --mlock
#                   here. Expect slower TG: pages come from the page cache.
#
#                   Disk: 156 + 1009 GB against 1.3 TB free leaves ~135 GB. Do not
#                   pull both without checking `df -h /models` first.
#
# Other candidates checked 2026-08-22 and deliberately NOT registered:
#   - GrEarl/Kimi-K3-Abliterated-Q2_K-GGUF: 929 GB, explicitly WIP/unverified;
#     its card recommends not downloading until that warning is removed.
#   - Ryanchen911/Kimi-K3-Uncensored-GGUF: 539.7 GiB IQ1_S-XS, useful refusal
#     measurements but PPL 1.9323 +/- 0.0473 versus 1.3253 +/- 0.031 here.
#   - audnai/penclaw: contradictory release/WIP status and no comparable PPL.
#
# There is NO validated uncensored/abliterated K3 at Q5attn-equivalent quality.
# Keep kimi-k3-q5attn selected. The K3 abliterated row remains registry-only and
# must pass perplexity + the complete serving gate before a harness uses it.

# Locally requantized siblings of `base` and `ds4-flash`. NON-EXPERT tensors only,
# Q8_0 -> Q5_K, every routed expert copied byte for byte:
#   llama-quantize --allow-requantize --keep-f32 --keep-pattern "_exps\." IN OUT Q5_K 64
#
# Publishers quantize experts hard and leave everything else at Q8_0, but with
# only a handful of experts active per token the always-read remainder dominates
# what a token actually READS: 58.6% of it for GLM, 68.5% for DS4. Measured TG,
# perplexity within error bars in both cases:
#
#   glm-q5attn        10.68 -> 12.43 tok/s (+16.4%)  PPL 1.3750 -> 1.3953 (+/-0.038)
#   ds4-flash-q5attn  23.82 -> 27.75 tok/s (+16.5%)  PPL 2.4020 -> 2.3884 (+/-0.114)
#   kimi-k3-q5attn     3.67 ->  4.30 tok/s (+17.2%)  PPL 1.3240 -> 1.3253 (+/-0.031)
#                         live after the 2026-08-22 rebase: 42.607 PP / 4.453 TG
#
# Q5_K rather than Q6_K deliberately: Q6_K is bigger, slower AND worse perplexity
# on all three. Four bits is a real quality step down (+0.15 to +0.24 PPL on DS4)
# for ~6% more TG. ADDING-A-MODEL.md section 7 has the full ladder.
#
# --keep-f32 matters: GLM's 79 indexer.proj tensors pick which tokens DSA
# attention sees, and nothing would have crashed if they had been quantized.
#
