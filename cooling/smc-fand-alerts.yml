# Prometheus alerting rules for smc-fand.
#
# The ordering here reflects what we actually learned running this box: the
# dangerous state is not "a fan failed", it is "the fans are already at maximum
# and the temperature is still climbing". Saturation is the leading indicator;
# by the time an emergency fires you are already out of options.
#
# smc_fand_up is the liveness anchor. The daemon deletes its textfile on a
# clean exit, so `absent(smc_fand_up)` means stopped and a stale heartbeat with
# smc_fand_up present means wedged. Without that distinction a stopped daemon
# looks identical to a hung one, because the textfile collector keeps serving
# the last written sample forever.

groups:
  - name: smc-fand
    rules:
      # --- cooling capacity -------------------------------------------------

      - alert: SmcFandZoneSaturated
        expr: smc_fand_saturated == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Fan zone {{ $labels.zone }} has been at 100% for 3 minutes"
          description: >-
            No cooling headroom left in this zone. If the driving temperature is
            still rising, the box cannot hold this workload. Check
            smc_fand_error_celsius for how far above setpoint it is.

      - alert: SmcFandSaturatedAndRising
        # Saturated AND still heating: the genuinely bad case.
        #
        # Uses smc_fand_error_celsius rather than the raw temperature: the
        # driving sensor can swap between groups (CPU vs DIMM), which
        # step-changes the temperature series and would make deriv() report a
        # slope that is really just a change of subject. Error is normalised
        # against whichever setpoint currently applies, so comparing it against
        # its own recent minimum is stable across a swap.
        expr: >-
          smc_fand_saturated == 1
          and (smc_fand_error_celsius - min_over_time(smc_fand_error_celsius[10m])) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Zone {{ $labels.zone }} maxed out and still heating"
          description: >-
            Fans are at 100% and the zone has moved further above setpoint over
            the last 10 minutes. Thermal throttling is the next step. Reduce
            load, improve airflow, or check for a missing air shroud.

      - alert: SmcFandEmergency
        expr: smc_fand_emergency == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Zone {{ $labels.zone }} above emergency threshold"
          description: >-
            A sensor group in {{ $labels.zone }} exceeded its emergency limit;
            fans forced to 100% regardless of the control loop.

      # --- loss of control --------------------------------------------------

      - alert: SmcFandControlLost
        expr: smc_fand_control_lost == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand cannot command zone {{ $labels.zone }}"
          description: >-
            Duty readback disagrees with the commanded value, and the write
            itself succeeded (see SmcFandWriteFailing for the other case). Some
            part of the BMC is overriding us - chassis intrusion ramps do this.
            Check `ipmitool -I open sensor get "Chassis Intru"`.

      - alert: SmcFandWriteFailing
        expr: smc_fand_write_failed == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand duty writes to zone {{ $labels.zone }} are failing"
          description: >-
            The BMC is refusing or timing out on duty commands, so the fans are
            frozen at their last accepted value. Often /dev/ipmi0 contention
            with the node-exporter ipmitool collector.

      # --- daemon liveness --------------------------------------------------

      - alert: SmcFandStale
        # Wedged, not stopped: metrics are still being published but no control
        # tick has completed. The independent watchdog should beat this alert.
        expr: smc_fand_up == 1 and (time() - smc_fand_heartbeat_timestamp_seconds) > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "smc-fand is publishing but not controlling"
          description: >-
            No fully successful control tick in over 3 minutes while the daemon
            still reports up. smc-fand-watchdog.timer should already have handed
            the fans back to the BMC; if this is still firing, verify that timer
            is enabled.

      - alert: SmcFandAbsent
        # Fires for a genuinely stopped daemon, because --restore removes the
        # textfile on the way out. The BMC has the fans, which is safe, but
        # nothing is optimising them.
        expr: absent(smc_fand_up)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand is not running"
          description: >-
            The BMC's own fan curve is in control - safe, but the low-RPM
            thresholds are only re-asserted at daemon startup, so a firmware
            update while stopped can silently restore the ~20s ramp cycle.

      # --- the original bug, in case it ever returns ------------------------

      - alert: SmcFandLowRpmFanTrip
        # Threshold sits just ABOVE the factory 420 RPM fan-fail limit, not
        # below it. The fans idle at ~420 RPM at SMC_MIN_DUTY by design, so a
        # rule that waits for <300 RPM can never fire - and during a fan-fail
        # ramp the RPM goes up, not down. What we want to catch is the fans
        # sitting near the factory limit at all.
        #
        # Requires monitoring/bmc-exporter.py. On a host without it this rule is
        # silently absent rather than failing, so confirm bmc_fan_rpm exists
        # before relying on it.
        expr: bmc_fan_rpm < 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fan {{ $labels.fan }} is near the factory fan-fail threshold"
          description: >-
            Running close to the 420 RPM factory lower-critical limit. If the
            BMC starts periodically ramping every ~20s, the thresholds have
            reverted - restart smc-fand (it re-asserts them at startup) or set
            them by hand with `ipmitool -I open sensor thresh <FAN> lcr 140`.
