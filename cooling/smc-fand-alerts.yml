# Prometheus alerting rules for smc-fand.
#
# The ordering reflects what running this box actually taught us: the dangerous
# state is not "a fan failed", it is "the fans are already at maximum and the
# temperature is still climbing". Saturation is the leading indicator; by the
# time an emergency fires you are already out of options.
#
# Note the metric shape: thermal state is labelled by DOMAIN (a set of sensors
# sharing a limit), while control state is labelled by ZONE (a set of fans).
# That split is the point of the design - domains say what must stay cool, the
# authority matrix says which zones achieve it.
#
# smc_fand_up is the liveness anchor. The daemon deletes its textfile on a clean
# exit, so `absent(smc_fand_up)` means stopped, while a stale heartbeat with
# smc_fand_up present means wedged. Without that distinction a stopped daemon
# looks identical to a hung one, because the textfile collector keeps serving
# the last written sample forever.

groups:
  - name: smc-fand
    rules:
      # --- cooling capacity -------------------------------------------------

      - alert: SmcFandDomainSaturated
        expr: smc_fand_domain_saturated == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Thermal domain {{ $labels.domain }} has demanded 100% for 3 minutes"
          description: >-
            This domain wants more cooling than any zone can give it. Check
            smc_fand_domain_error_celsius for how far above setpoint it is, and
            smc_fand_zone_coupled to confirm every zone has been pulled in to
            help.

      - alert: SmcFandSaturatedAndRising
        # Saturated AND still heating: the genuinely bad case.
        #
        # Uses error rather than raw temperature: the sensor driving a domain
        # can change (DIMMA~F vs DIMMG~L), which step-changes the temperature
        # series. Error is normalised against the setpoint, so comparing it
        # against its own recent minimum stays meaningful across a swap.
        expr: >-
          smc_fand_domain_saturated == 1
          and (smc_fand_domain_error_celsius - min_over_time(smc_fand_domain_error_celsius[10m])) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Domain {{ $labels.domain }} maxed out and still heating"
          description: >-
            Every zone that can help is already at maximum and this domain has
            moved further above setpoint over 10 minutes. Thermal throttling is
            next. Reduce load, or improve airflow - a missing air shroud is the
            usual cause on this class of chassis.

      - alert: SmcFandEmergency
        expr: smc_fand_domain_emergency == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Domain {{ $labels.domain }} above its emergency threshold"
          description: >-
            All zones forced to 100%, bypassing the control loop and the
            authority matrix entirely.

      - alert: SmcFandDomainUnreadable
        # Without this, a domain whose sensors get renamed simply stops
        # emitting - and an alert on an absent series never fires. Silence that
        # reads exactly like health is the failure mode worth naming.
        expr: smc_fand_domain_readable == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "smc-fand cannot read any sensor for domain {{ $labels.domain }}"
          description: >-
            This domain is contributing nothing to fan demand and its emergency
            threshold cannot be evaluated - it could overheat with no response
            and no other alert. Usually a BMC firmware update renaming sensors.
            Compare `ipmitool -I open sdr type Temperature` against
            SMC_DOMAIN_{{ $labels.domain | toUpper }}_SENSORS.

      # --- loss of control --------------------------------------------------

      - alert: SmcFandControlLost
        expr: smc_fand_control_lost == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand cannot command zone {{ $labels.zone }}"
          description: >-
            Duty readback disagrees with the commanded value, and the write
            itself succeeded (see SmcFandWriteFailing for the other case).
            Something in the BMC is overriding us - chassis intrusion ramps do
            this. Check `ipmitool -I open sensor get "Chassis Intru"`.

      - alert: SmcFandWriteFailing
        expr: smc_fand_write_failed == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand duty writes to zone {{ $labels.zone }} are failing"
          description: >-
            The BMC is refusing or timing out on duty commands, so the fans are
            frozen at their last accepted value. Often /dev/ipmi0 contention
            with the node-exporter ipmitool collector.

      # --- authority matrix -------------------------------------------------

      - alert: SmcFandAuthorityDrift
        # Advisory by construction: the daemon flags drift but never retunes
        # control from passive observation, because duty correlates with load
        # and the naive signal says "more fans => hotter".
        expr: smc_fand_authority_drift == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Zone {{ $labels.zone }} response to {{ $labels.domain }} has changed"
          description: >-
            The measured cooling response no longer matches the calibrated
            matrix - a fan swapped, a shroud moved, a filter clogged, or thermal
            paste degraded. Control is unaffected and still safe. Re-run
            `systemctl start smc-fand-calibrate` when convenient.

      - alert: SmcFandUncalibrated
        # Uniform authority is safe but runs every zone at the worst domain's
        # demand, which is louder than necessary. Worth knowing, not urgent.
        # Note the shape: `smc_fand_authority_timestamp_seconds` has no labels
        # while `smc_fand_authority` is per zone/domain, so `and`-ing them
        # directly matches nothing - vector matching needs identical label sets.
        # Comparing scalars sidesteps that entirely.
        expr: >-
          smc_fand_authority_timestamp_seconds == 0
          and on() (min(smc_fand_authority) == 1)
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "smc-fand has never been calibrated"
          description: >-
            Every zone is fully coupled to every domain. Correct and safe, but
            the fans are working harder than the chassis requires. Run
            `smc-fand --calibrate` with the service stopped.

      # --- daemon liveness --------------------------------------------------

      - alert: SmcFandStale
        # Wedged, not stopped: metrics still published but no control tick has
        # completed. The independent watchdog should beat this alert.
        expr: smc_fand_up == 1 and (time() - smc_fand_heartbeat_timestamp_seconds) > 180
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "smc-fand is publishing but not controlling"
          description: >-
            No fully successful control tick in over 3 minutes while the daemon
            still reports up. smc-fand-watchdog.timer should already have handed
            the fans back to the BMC; if this is still firing, verify that timer
            is enabled.

      - alert: SmcFandAbsent
        # Fires for a genuinely stopped daemon, because --restore removes the
        # textfile on the way out. The BMC has the fans, which is safe, but
        # nothing is optimising them.
        #
        # Expect this during a calibration sweep, which stops the service for
        # 15-20 minutes by design.
        expr: absent(smc_fand_up)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand is not running"
          description: >-
            The BMC's own fan curve is in control - safe, but the low-RPM
            thresholds are only re-asserted at daemon startup, so a firmware
            update while stopped can silently restore the ~20s ramp cycle.

      - alert: SmcFandFlapping
        # max_failures(3) x tick(5s) + RestartSec(10s) cycles in about 25s, so a
        # crash-looping daemon clears and re-arms every other rule before their
        # `for:` clauses elapse. Averaging over a window catches what point-in-
        # time conditions cannot.
        expr: avg_over_time(smc_fand_up[15m]) < 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "smc-fand is restarting repeatedly"
          description: >-
            The daemon is up less than 80% of the time, so it is crash-looping
            rather than running. Each cycle hands the fans to the BMC and takes
            them back. Check `journalctl -u smc-fand -p err`.

      # --- the original bug, in case it ever returns ------------------------

      - alert: SmcFandThresholdUnverified
        # Watches the daemon's own verification rather than raw RPM. An RPM
        # rule cannot work here: the fans idle at ~420 RPM at SMC_MIN_DUTY by
        # design, which is the factory fan-fail limit itself, so any threshold
        # that would catch the bug also fires continuously in normal operation.
        # And during a fan-fail ramp the RPM goes UP, not down.
        expr: smc_fand_fan_threshold_ok == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "smc-fand could not confirm the fan-fail thresholds"
          description: >-
            The low-RPM thresholds could not be read back as set, so the daemon
            has raised its duty floor to SMC_UNVERIFIED_MIN_DUTY to stay clear
            of whatever limit the BMC is actually enforcing. The box is safe but
            louder than it should be. Set them by hand with
            `ipmitool -I open sensor thresh <FAN> lcr 140`, verify the readback,
            and restart smc-fand to get the quiet floor back.
