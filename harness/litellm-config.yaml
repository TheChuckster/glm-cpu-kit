# litellm proxy config - ONLY needed for Claude Code (it speaks Anthropic /v1/messages,
# which litellm translates to the server's OpenAI /v1/chat/completions).
# For opencode/aider you DON'T need this - point them straight at http://SERVER_IP:8080/v1.
# See runbook §9 for why this translation layer is fragile (run exactly ONE instance).
#
# Start with:  litellm --config litellm-config.yaml --host 0.0.0.0 --port 4000 --num_workers 1
# EDIT: SERVER_IP and PASTE_YOUR_GLM_API_KEY_HERE (from ~/.glm-api-key on the server).

model_list:
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      # 753B MoE on CPU: a big agentic prompt can take many minutes. Wait, don't error.
      timeout: 21600
      stream_timeout: 21600
      # Anti-repetition (quantized + greedy tool-calling loops). Fills in what the client omits.
      temperature: 0.5
      top_p: 0.95
      frequency_penalty: 0.4
      presence_penalty: 0.2

  # GLM-5.3 Q4, same one-resident-model caveat as every local route below.
  # Reasoning effort, history clearing and sampling are fixed by its registry
  # row so direct OpenCode and translated clients receive the same behavior.
  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600


  # Abliterated variants. These route to the SAME server as glm-5.2 above -
  # only one model is resident at a time (each is 340-460 GB and mlocked), so
  # which of these actually answers depends on what `glm-model use` selected.
  #
  # llama-server does NOT reject a request whose `model` names a different
  # alias than the loaded one, so asking for an inactive variant silently
  # returns whichever is live. Check with `glm-model status` first.
  - model_name: glm-5.2-abliterated
    litellm_params:
      model: openai/glm-5.2-abliterated
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  - model_name: glm-5.2-abliterated-q3
    litellm_params:
      model: openai/glm-5.2-abliterated-q3
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  # Kimi variants - same server, same one-resident-model caveat as above.
  # ~1T total but only ~32B active against GLM's ~40B, so these generate
  # FASTER here (TG is memory-bandwidth-bound, runbook §0) while costing
  # ~145 GB more RAM to hold. Both are genuine 4-bit.
  #
  # No temperature/penalty overrides: Moonshot's own generation_config asks for
  # temp 1.0 / top_p 0.95, and serve-glm.sh already applies those plus
  # --repeat-penalty server-side from the registry's per-variant opts. Setting
  # them here too would fight the server rather than help it.
  - model_name: kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  - model_name: kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  # kimi-k3 is routed further down - it IS servable now, on a forked engine.
  # kimi-k3-ik stays unrouted: ubergarm has published no K3 quant, so that row
  # is still a guess about what they will name the files.

  # DeepSeek-V4-Flash-0731 - same server, same one-resident-model caveat.
  # 284B total but only ~13B active and natively fp4, so ~155 GB resident and
  # roughly 2-3x GLM's generation speed (runbook §6b). This is the variant to
  # reach for when GLM's ~10 tok/s is the thing making a session unpleasant.
  #
  # No sampling overrides here on purpose. DeepSeek's generation_config asks for
  # temp 1.0 / top_p 1.0 and the registry already applies exactly that
  # server-side, alongside serve-glm.sh's --repeat-penalty 1.1. The GLM rows
  # above carry frequency/presence penalties because a quantized model decoding
  # near-greedy for tool calls falls into repetition loops; if DS4 shows that
  # too, add them here - but measure first rather than inheriting GLM's numbers,
  # because this model reasons on every turn and over-penalising a reasoning
  # trace degrades it.
  - model_name: deepseek-v4-flash-0731
    litellm_params:
      model: openai/deepseek-v4-flash-0731
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  # Abliterated sibling. Distinct model_name on purpose - the two quant siblings
  # above share an alias because they are drop-in equivalents; an abliterated
  # model is not, and you must be able to tell which answered.
  - model_name: deepseek-v4-flash-0731-abl
    litellm_params:
      model: openai/deepseek-v4-flash-0731-abl
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  - model_name: deepseek-v4-flash-0731-mix
    litellm_params:
      model: openai/deepseek-v4-flash-0731-mix
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

  # Kimi K3, served by the shared build from the FORKED ik engine (see
  # porting/k3/). Same
  # one-resident-model caveat as every row above.
  #
  # Two things to know before pointing an agent at this:
  #  - the live Q5-attention row measures ~42.7 PP / ~4.49 TG tok/s, so a fresh
  #    7K+ OpenCode prompt still takes minutes before the first token;
  #  - the current K3 parser cleanly separates reasoning, content, and tool calls.
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: http://SERVER_IP:8080/v1
      api_key: PASTE_YOUR_GLM_API_KEY_HERE
      timeout: 21600
      stream_timeout: 21600

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 21600
  num_retries: 0        # one request, wait it out - no retry storms
